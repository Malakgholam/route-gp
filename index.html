<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memaar Al Morshedy - Collection Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================================
       NO-SCROLL LAYOUT SETUP
    ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Prevents scrollbars */
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      background-color: #070d19;
      color: #ffffff;
    }

    .dashboard-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(circle at 80% 10%, rgba(0, 168, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 10% 90%, rgba(13, 43, 99, 0.6) 0%, transparent 50%),
        linear-gradient(135deg, #070e1c 0%, #0b1c3d 50%, #071126 100%);
      display: flex;
      flex-direction: column;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
    }

    /* =========================================================
       TOPBAR
    ========================================================= */
    .topbar {
      position: relative;
      z-index: 10;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4vw;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(11, 28, 61, 0.7);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .brand-title {
      font-size: clamp(12px, 1vw, 15px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* =========================================================
       HERO (DYNAMIC FILL - NO SPACING GAPS)
    ========================================================= */
    .hero {
      position: relative;
      z-index: 5;
      flex: 1; /* Takes all available height between topbar and bottom section */
      padding: 0 4vw;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* Transparent Background Image Layer */
    .hero-bg-image {
      position: absolute;
      inset: 0;
      background-image: url('C:\\Users\\20128\\Desktop\\route gp\\images (3).jpg');
      background-size: cover;
     
      filter: saturate(0.8) contrast(1.1);
      pointer-events: none;
      z-index: 1;
    }

    /* Dark Overlay Gradient */
    .hero-bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg, 
        rgba(7, 14, 28, 0.95) 0%, 
        rgba(11, 28, 61, 0.75) 50%, 
        rgba(7, 14, 28, 0.85) 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 650px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(0, 168, 255, 0.15);
      border: 1px solid rgba(0, 168, 255, 0.4);
      border-radius: 4px;
      color: #00a8ff;
      font-size: clamp(8px, 0.7vw, 10px);
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 12px;
    }

    .hero h1 {
      font-size: clamp(28px, 3.2vw, 48px);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .hero h1 span {
      background: linear-gradient(135deg, #ffffff 30%, #00a8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      font-size: clamp(12px, 0.9vw, 14px);
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 20px;
      max-width: 550px;
    }

    .main-navigation {
      display: flex;
      gap: 16px;
    }

    .main-button {
      flex: 1;
      max-width: 230px;
      height: 55px;
      padding: 0 14px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .main-button:hover {
      transform: translateY(-2px);
    }

    .main-button.primary {
      background: linear-gradient(135deg, #00a8ff 0%, #0056b3 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 168, 255, 0.3);
    }

    .main-button.secondary {
      background: rgba(11, 28, 61, 0.6);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      backdrop-filter: blur(8px);
    }

    .button-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .primary .button-icon { background: rgba(255, 255, 255, 0.2); }
    .secondary .button-icon { background: rgba(0, 168, 255, 0.2); }

    .button-text strong { font-size: 13px; font-weight: 600; display: block; }

    /* =========================================================
       PROJECTS SECTION
    ========================================================= */
    .projects {
      position: relative;
      z-index: 5;
      height: 34vh;
      padding: 16px 4vw;
      background: #ffffff;
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .projects-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .projects-title h2 {
      font-size: clamp(14px, 1.2vw, 18px);
      font-weight: 600;
      color: #070e1c;
    }

    .project-count strong {
      font-size: 18px;
      color: #00a8ff;
    }

    .project-count span {
      font-size: 9px;
      color: #070e1c;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      height: calc(100% - 30px);
    }

    .project-card {
      position: relative;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-size: cover;
      background-position: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
    }

    .project-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 14, 28, 0.2) 0%, rgba(7, 14, 28, 0.9) 100%);
      z-index: 1;
    }

    .project-card:hover {
      transform: translateY(-3px);
      border-color: #00a8ff;
    }

    .card-top, .card-bottom {
      position: relative;
      z-index: 2;
    }

    .card-number {
      font-size: 9px;
      font-weight: 700;
      color: #00a8ff;
      background: rgba(7, 14, 28, 0.75);
      padding: 2px 5px;
      border-radius: 3px;
    }

    .project-card h3 {
      font-size: clamp(10px, 0.7vw, 12px);
      font-weight: 600;
      line-height: 1.2;
    }

    .project-card p {
      font-size: 7px;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

<div class="dashboard-container">
  <div class="overlay"></div>

  <header class="topbar">
    <div class="brand-container">
      <img src="C:\Users\20128\Desktop\route gp\images__2_-removebg-preview.png" alt="Logo" class="brand-logo-img">
      <div class="brand-title">Memaar Al Morshedy</div>
    </div>
  </header>

  <main class="hero">
    <div class="hero-bg-image"></div>
    <div class="hero-bg-overlay"></div>

    <div class="hero-content">
      <span class="badge">REAL ESTATE DEVELOPMENT</span>
      <h1>Collection <br><span>Dashboard</span></h1>
      <p class="description">Consolidated analytics of sales performance and collection tracking across all developments.</p>

      <div class="main-navigation">
        <button class="main-button primary" type="button" onclick="openDashboard('Open Global Summary')">
          <div class="button-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19V5"></path><path d="M4 19h17"></path>
              <rect x="7" y="12" width="3" height="5"></rect>
              <rect x="12" y="9" width="3" height="8"></rect>
            </svg>
          </div>
          <div class="button-text">
            <strong>Global Summary</strong>
          </div>
        </button>

        <button class="main-button secondary" type="button" onclick="openDashboard('Open Date Summary')">
          <div class="button-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00a8ff" stroke-width="2">
              <rect x="3" y="4" width="18" height="17" rx="2"></rect>
              <path d="M3 10h18"></path>
            </svg>
          </div>
          <div class="button-text">
            <strong>Collection by Date</strong>
          </div>
        </button>
      </div>
    </div>
  </main>

  <section class="projects">
    <div class="projects-header">
      <div class="projects-title">
        <h2>Explore Project Portfolios</h2>
      </div>
      <div class="project-count">
        <strong>08</strong> <span>PROJECTS</span>
      </div>
    </div>

    <div class="project-grid" id="project-grid"></div>
  </section>

</div>

<script>
  const projectsData = [
    { name: "One Kattameya Compound", image: "images (9).jpg" },
    { name: "Zahra North Coast", image: "images (4).jpg" },
    { name: "Degla Landmark", image: "images (5).jpg" },
    { name: "Skyline Katamya", image: "images (6).jpg" },
    { name: "Degla Palms 6th October", image: "images (10).jpg" },
    { name: "Lake Front 6th October", image: "images (7).jpg" },
    { name: "Crystal Plaza Maadi", image: "images (11).jpg" },
    { name: "Rihana Avenue", image: "images (8).jpg" }
  ];

  const projectGrid = document.getElementById("project-grid");

  function openDashboard(message) {
    if (typeof sendPrompt === "function") {
      sendPrompt(message);
      return;
    }
    console.log(message);
  }

  projectsData.forEach((project, index) => {
    const card = document.createElement("div");
    card.className = "project-card";
    card.style.backgroundImage = `url('${project.image}')`;

    card.innerHTML = `
      <div class="card-top">
        <span class="card-number">${String(index + 1).padStart(2, "0")}</span>
      </div>
      <div class="card-bottom">
        <h3>${project.name}</h3>
        <p>VIEW DASHBOARD</p>
      </div>
    `;

    card.addEventListener("click", () => {
      openDashboard("Open Overall page for " + project.name);
    });

    projectGrid.appendChild(card);
  });
</script>

</body>
</html>
