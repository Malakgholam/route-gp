          5px

}

<script>

/* =========================================================
   PROJECT DATA
========================================================= */

var projects = [

  "One Kattameya Compound",

  "Zahra North Coast",

  "Degla Landmark",

  "Skyline Katamya Compound",

  "Degla Palms 6 October Compound",

  "Lake Front 6 October",

  "Crystal Plaza Maadi Compound",

  "Rihana Avenue"

];


var track =
  document.getElementById(
    "carousel-track"
  );


var dots =
  document.getElementById(
    "dots"
  );


/* =========================================================
   CREATE CARD
========================================================= */

function createProjectCard(
  name,
  index
) {

  var card =
    document.createElement(
      "div"
    );


  card.className =
    "project-card";


  card.innerHTML = `

    <span class="card-number">

      ${String(index + 1).padStart(2,"0")}

    </span>


    <div class="card-icon">

      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#c9a961"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M3 21h18"/>

        <path d="M5 21V9l7-5 7 5v12"/>

        <path d="M9 21v-6h6v6"/>

        <path d="M9 10h.01"/>

        <path d="M15 10h.01"/>

      </svg>

    </div>


    <h3>
      ${name}
    </h3>


    <p>
      PROJECT DASHBOARD
    </p>


    <div class="card-arrow">

      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#c9a961"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M7 17L17 7"/>

        <path d="M7 7h10v10"/>

      </svg>

    </div>

  `;


  /* OPEN PROJECT */

  card.onclick =
    function() {

      sendPrompt(
        "Open the Overall page for " +
        name
      );

    };


  return card;

}


/* =========================================================
   CREATE TWO COPIES
=========================================================

   We create the projects TWICE.

   This is what allows the animation
   to loop seamlessly.
*/

projects.forEach(

  function(name,index) {

    track.appendChild(
      createProjectCard(
        name,
        index
      )
    );

  }

);


projects.forEach(

  function(name,index) {

    track.appendChild(
      createProjectCard(
        name,
        index
      )
    );

  }

);


/* =========================================================
   CREATE NUMBER NAVIGATION
========================================================= */

projects.forEach(

  function(name,index) {

    var indicator =
      document.createElement(
        "div"
      );


    indicator.className =
      "project-indicator";


    indicator.innerHTML =
      String(index + 1)
      .padStart(2,"0");


    indicator.onclick =
      function() {

        /*
           Pause animation temporarily
        */

        track.style.animationPlayState =
          "paused";


        /*
           Find the original card
        */

        var cards =
          track.querySelectorAll(
            ".project-card"
          );


        var card =
          cards[index];


        if(card) {

          card.scrollIntoView({
            behavior:
              "smooth",
            block:
              "nearest",
            inline:
              "center"
          });

        }


        /*
           Highlight indicator
        */

        Array.from(
          dots.children
        ).forEach(

          function(item,i) {

            item.classList.toggle(
              "active",
              i === index
            );

          }

        );


        /*
           Resume after a moment
        */

        setTimeout(

          function() {

            track.style.animationPlayState =
              "running";

          },

          2500

        );

      };


    dots.appendChild(
      indicator
    );

  }

);


/* =========================================================
   INITIAL ACTIVE INDICATOR
========================================================= */

if(dots.children.length) {

  dots.children[0]
    .classList.add("active");

}


/* =========================================================
   LEFT BUTTON
========================================================= */

document
  .getElementById(
    "scroll-left"
  )
  .onclick =
  function() {

    /*
       Temporarily pause
    */

    track.style.animationPlayState =
      "paused";


    /*
       Move track visually
    */

    track.animate(

      [
        {
          transform:
            "translateX(0)"
        },

        {
          transform:
            "translateX(160px)"
        }

      ],

      {
        duration:
          500,

        easing:
          "ease-out",

        fill:
          "forwards"

      }

    );


    setTimeout(

      function() {

        track.style.animationPlayState =
          "running";

      },

      1000

    );

  };


/* =========================================================
   RIGHT BUTTON
========================================================= */

document
  .getElementById(
    "scroll-right"
  )
  .onclick =
  function() {

    track.style.animationPlayState =
      "paused";


    track.animate(

      [
        {
          transform:
            "translateX(0)"
        },

        {
          transform:
            "translateX(-160px)"
        }

      ],

      {

        duration:
          500,

        easing:
          "ease-out",

        fill:
          "forwards"

      }

    );


    setTimeout(

      function() {

        track.style.animationPlayState =
          "running";

      },

      1000

    );

  };


</script>
