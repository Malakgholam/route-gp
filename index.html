/* =========================================================

========================================================= */

function openDashboard(message) {
  if (typeof sendPrompt === "function") {
    sendPrompt(message);
    return;
  }

  console.log(message);
}

/* =========================================================
   PROJECT CARD CREATION
========================================================= */

function createProjectCard(name, index) {
  const card = document.createElement("button");

  card.type = "button";
  card.className = "project-card";

  card.innerHTML = `
    <span class="card-number">
      ${String(index + 1).padStart(2, "0")}
    </span>

    <div class="card-icon">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#c9a961"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 21h18"></path>
        <path d="M5 21V9l7-5 7 5v12"></path>
        <path d="M9 21v-6h6v6"></path>
        <path d="M9 10h.01"></path>
        <path d="M15 10h.01"></path>
      </svg>
    </div>

    <h3>${name}</h3>

    <p>PROJECT DASHBOARD</p>

    <div class="card-arrow">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#c9a961"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M7 17L17 7"></path>
        <path d="M7 7h10v10"></path>
      </svg>
    </div>
  `;

  card.addEventListener("click", function () {
    openDashboard("Open the Overall page for " + name);
  });

  return card;
}

/* =========================================================
   RENDER STATIC PROJECT LIST
========================================================= */

projects.forEach(function (projectName, index) {
  projectGrid.appendChild(
    createProjectCard(projectName, index)
  );
});

</script>
